# 1. Configuración general de la aplicación
spring.application.name=pixelworks-api
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# 2. Configuración de Seguridad y JWT
# app.jwt.secret DEBE tener al menos 32 caracteres (256 bits) para HS256 - un secreto corto hace que jjwt lance una excepción al arrancar.
app.jwt.secret=token_secreto
# 4 horas en milisegundos. Ajusta según cuánto dure una jornada de uso típica.
app.jwt.expiration-ms=14400000

# 3. Conexión a la base de datos (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pixelworks_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# 4. Configuración de Persistencia (JPA / Hibernate)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# 5. Internacionalización y zona horaria (El Salvador)
spring.jpa.properties.hibernate.jdbc.time_zone=America/El_Salvador
spring.jackson.time-zone=America/El_Salvador
spring.jackson.locale=es_SV

# 6. Definir tamaños máximos de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}
server.compression.enabled=true